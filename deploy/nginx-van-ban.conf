# van-ban.ducanhphzz.io.vn — Quản lý số văn bản
#
# Bước 1 (hiện tại): chỉ HTTP, để certbot làm được thử thách HTTP-01.
# Bước 2: chạy `sudo certbot --nginx -d van-ban.ducanhphzz.io.vn`
#         certbot sẽ tự thêm khối 443 và chuyển hướng 80 -> 443.
server {
    listen 80;
    listen [::]:80;
    server_name van-ban.ducanhphzz.io.vn;

    # Sổ văn bản có file scan đính kèm; mặc định 1m của nginx là quá nhỏ.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Bắt buộc: ứng dụng dựa vào header này để đặt cờ Secure cho cookie
        # phiên khi đã có HTTPS. Thiếu nó thì cookie không bao giờ được Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
